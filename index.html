<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spotify - Your Favourite Music Is Here</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <ul>
            <li class="brand">
                <img src="logo.png" alt="Spotify Logo">
                Spotify
            </li>

            <li>Home</li>
            <li>About</li>
        </ul>
    </nav>

    <div class="container">

        <div class="songlist">
            <h1>Best of NCS - No Copyright Sounds</h1>

            <div class="songIteamContainer">

                <div class="songItem">
                    <img src="covers/1.jpg" alt="Let Me Love You">
                    <span class="songName">Let Me Love You</span>

                    <span class="songListPay">
                        <span class="timestamp">
                            05:34
                            <i id="0" class="far songItemPlay fa-circle-play"></i>
                        </span>
                    </span>
                </div>

                <div class="songItem">
                    <img src="covers/2.jpg" alt="Faded">
                    <span class="songName">Faded</span>

                    <span class="songListPay">
                        <span class="timestamp">
                            03:32
                            <i id="1" class="far songItemPlay fa-circle-play"></i>
                        </span>
                    </span>
                </div>

                <div class="songItem">
                    <img src="covers/3.jpg" alt="On and On">
                    <span class="songName">On and On</span>

                    <span class="songListPay">
                        <span class="timestamp">
                            03:28
                            <i id="2" class="far songItemPlay fa-circle-play"></i>
                        </span>
                    </span>
                </div>

                <div class="songItem">
                    <img src="covers/4.jpg" alt="Invincible">
                    <span class="songName">Invincible</span>

                    <span class="songListPay">
                        <span class="timestamp">
                            04:10
                            <i id="3" class="far songItemPlay fa-circle-play"></i>
                        </span>
                    </span>
                </div>

                <div class="songItem">
                    <img src="covers/5.jpg" alt="Mortals">
                    <span class="songName">Mortals</span>

                    <span class="songListPay">
                        <span class="timestamp">
                            03:50
                            <i id="4" class="far songItemPlay fa-circle-play"></i>
                        </span>
                    </span>
                </div>

                <div class="songItem">
                    <img src="covers/6.jpg" alt="Sky High">
                    <span class="songName">Sky High</span>

                    <span class="songListPay">
                        <span class="timestamp">
                            03:24
                            <i id="5" class="far songItemPlay fa-circle-play"></i>
                        </span>
                    </span>
                </div>

                <div class="songItem">
                    <img src="covers/7.jpg" alt="Why We Lose">
                    <span class="songName">Why We Lose</span>

                    <span class="songListPay">
                        <span class="timestamp">
                            03:18
                            <i id="6" class="far songItemPlay fa-circle-play"></i>
                        </span>
                    </span>
                </div>

                <div class="songItem">
                    <img src="covers/8.jpg" alt="Heroes Tonight">
                    <span class="songName">Heroes Tonight</span>

                    <span class="songListPay">
                        <span class="timestamp">
                            03:29
                            <i id="7" class="far songItemPlay fa-circle-play"></i>
                        </span>
                    </span>
                </div>

                <div class="songItem">
                    <img src="covers/9.jpg" alt="My Heart">
                    <span class="songName">My Heart</span>

                    <span class="songListPay">
                        <span class="timestamp">
                            03:42
                            <i id="8" class="far songItemPlay fa-circle-play"></i>
                        </span>
                    </span>
                </div>

                <div class="songItem">
                    <img src="covers/10.jpg" alt="Symbolism">
                    <span class="songName">Symbolism</span>

                    <span class="songListPay">
                        <span class="timestamp">
                            04:02
                            <i id="9" class="far songItemPlay fa-circle-play"></i>
                        </span>
                    </span>
                </div>

            </div>
        </div>

        <div class="songBanner"></div>

    </div>

    <div class="bottom">

        <input
            type="range"
            name="range"
            id="myProgressBar"
            min="0"
            max="100"
            value="0"
        >

        <div class="icons">

            <!-- Font Awesome Icons -->

            <span id="previous" class="control-btn">
                <i class="fa-solid fa-2x fa-backward-step"></i>
            </span>

            <span id="masterPlay" class="control-btn">
                <i class="far fa-2x fa-circle-play"></i>
            </span>

            <span id="next" class="control-btn">
                <i class="fa-solid fa-2x fa-forward-step"></i>
            </span>

        </div>

        <div class="songInfo">
            <img
                src="playing.gif"
                width="42"
                alt="Playing animation"
                id="gif"
            >

            <span id="masterSongName">
                Warriyo - Mortals [NCS Release]
            </span>
        </div>

    </div>

    <script
        src="https://kit.fontawesome.com/d919b35967.js"
        crossorigin="anonymous">
    </script>

    <script src="script.js"></script>

</body>

</html>
